# Perfil de pruebas JUnit: H2 en memoria en modo PostgreSQL.
# Hibernate crea las tablas a partir de las entidades, así que estas pruebas verifican el MAPEO JPA
# (relaciones, únicos, enums, jsonb) sin depender de la red. Lo que solo existe en PostgreSQL
# (trigger de enrollment.course_id, índice parcial, CHECK, RLS) se prueba con Postman contra la API desplegada.
spring.datasource.url=jdbc:h2:mem:codice;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
