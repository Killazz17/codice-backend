server.port=${PORT:8080}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Seguridad: el secreto JWT viene solo de la variable JWT_SECRET (Secret Manager en Google Cloud).
# Sin valor por defecto: si falta, la app no arranca en lugar de firmar tokens con una clave conocida.
jwt.secret=${JWT_SECRET}

# IA: en producción el proveedor real es el valor por defecto, nunca el simulado. La llave llega de Secret Manager
# (AI_API_KEY); si falta, la API responde 503 en los endpoints de IA en lugar de inventar texto.
ai.provider=${AI_PROVIDER:gemini}

# El health check es público: en prod no se exponen detalles de la base ni del disco.
management.endpoint.health.show-details=never
