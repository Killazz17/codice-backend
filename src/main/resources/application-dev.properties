# Perfil de desarrollo: PostgreSQL local con el usuario propio "codice" (no el superusuario postgres).
# El esquema lo manda db/schema.sql, no Hibernate: por eso validate, que solo compara las entidades
# contra las tablas y no toca nada. La contraseña se lee de la variable de entorno DB_PASSWORD.
spring.jpa.hibernate.ddl-auto = validate

spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/codice}
spring.datasource.username = ${DB_USER:codice}
spring.datasource.password = ${DB_PASSWORD:}
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true
