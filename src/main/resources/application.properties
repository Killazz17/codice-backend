spring.profiles.active=dev

# Banner
spring.banner.location=banner.txt

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# API Conventions
api.prefix=/api/v1

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Flyway
spring.flyway.enabled=false

# IA (IA-01): el proveedor y la llave llegan por variable de entorno; la llave nunca va en el código ni en el APK.
# mock = respuestas simuladas para desarrollo y pruebas (en prod el valor por defecto es gemini).
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-3.5-flash}
# Modelo de respaldo: se prueba si el principal agota su cuota (429), se retira (404) o está saturado (5xx). Cada modelo
# tiene su propia cuota. Vacío = sin respaldo.
ai.fallback-model=${AI_FALLBACK_MODEL:}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
# Espera base entre reintentos cuando el proveedor falla de forma pasajera (503, 429, timeout): 1,5 s y luego 3 s.
ai.retry-delay-ms=${AI_RETRY_DELAY_MS:1500}
# Un bloque transcrito con confianza menor a este valor se marca para revisión obligatoria.
ai.review-threshold=0.70

# Fotos de apuntes: el límite por defecto de Spring (1 MB) rechazaría casi cualquier foto de celular.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
